# The verify workflow reads these only inside its TEE handler. During runner
# simulation the values come from the runner process environment (inherited by
# its CRE child); deployed workflows receive them from the Vault DON.
# `CRE_CALLBACK_TOKEN_VAR` deliberately differs from the secret ID to avoid the
# CRE CLI's secret-name substring-resolution bug.
secretsNames:
  CALLBACK_TOKEN:
    - CRE_CALLBACK_TOKEN_VAR
