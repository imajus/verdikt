networks:
  default: localnet

  localnet:
    url: 'http://127.0.0.1:4000/api'

  studionet: {}

  # The Agent Tank submission target: chain 61997, the release-candidate
  # environment for the next Studio and consensus stack. A preconfigured
  # network in the genlayer-py/gltest this repo pins — on the older 0.18 line
  # it did not exist and could not be reached from here at all.
  studio_devnet: {}

  # GenLayer's public testnet. The key has to be one genlayer-py knows
  # (`localnet`, `studionet`, `studio_devnet`, `testnet_asimov`,
  # `testnet_bradbury`) — it is how the chain is resolved, not a free-form
  # label.
  testnet_bradbury:
    url: 'https://rpc-bradbury.genlayer.com'

  # No `studio_dev` entry: gltest's `chain_type` resolves to genlayer_py's
  # unmodified preset chain object regardless of any `id`/`url` given here, so
  # there is no way to hand this suite chain id 61997. `scripts/deploy.py` and
  # `scripts/claim.py` reach Studio Dev directly through `genlayer_py`'s
  # client instead — see `scripts/_networks.py`.

paths:
  contracts: 'contracts'

environment: .env
