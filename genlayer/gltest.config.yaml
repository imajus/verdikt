networks:
  default: localnet

  localnet:
    url: 'http://127.0.0.1:4000/api'

  studionet: {}

  # GenLayer's public testnet. The key has to be one genlayer-py knows
  # (`localnet`, `studionet`, `testnet_asimov`, `testnet_bradbury`) — it is how
  # the chain is resolved, not a free-form label.
  testnet_bradbury:
    url: 'https://rpc-bradbury.genlayer.com'

paths:
  contracts: 'contracts'

environment: .env
